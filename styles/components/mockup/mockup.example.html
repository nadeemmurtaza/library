<!-- sources: https://daisyui.com/components/mockup-browser/, https://daisyui.com/components/mockup-code/, https://daisyui.com/components/mockup-phone/, https://daisyui.com/components/mockup-window/ -->
<!-- mockup-browser: browser mockup with border -->
<div class="mockup-browser border border-base-300 w-full">
  <div class="mockup-browser-toolbar">
    <div class="input">https://daisyui.com</div>
  </div>
  <div class="grid place-content-center border-t border-base-300 h-80">Hello!</div>
</div>

<!-- mockup-browser: browser mockup with background color -->
<div class="mockup-browser bg-base-100 w-full border border-base-300">
  <div class="mockup-browser-toolbar">
    <div class="input">https://daisyui.com</div>
  </div>
  <div class="grid place-content-center h-80">Hello!</div>
</div>

<!-- mockup-code: mockup code with line prefix -->
<div class="mockup-code w-full">
  <pre data-prefix="$"><code>npm i daisyui</code></pre>
</div>

<!-- mockup-code: Multi line -->
<div class="mockup-code w-full">
  <pre data-prefix="$"><code>npm i daisyui</code></pre>
  <pre data-prefix=">" class="text-warning"><code>installing...</code></pre>
  <pre data-prefix=">" class="text-success"><code>Done!</code></pre>
</div>

<!-- mockup-code: Highlighted line -->
<div class="mockup-code w-full">
  <pre data-prefix="1"><code>npm i daisyui</code></pre>
  <pre data-prefix="2"><code>installing...</code></pre>
  <pre data-prefix="3" class="bg-warning text-warning-content"><code>Error!</code></pre>
</div>

<!-- mockup-code: Long line will scroll -->
<div class="mockup-code w-full">
  <pre
    data-prefix="~"><code>Magnam dolore beatae necessitatibus nemopsum itaque sit. Et porro quae qui et et dolore ratione.</code></pre>
</div>

<!-- mockup-code: Without prefix -->
<div class="mockup-code w-full">
  <pre><code>without prefix</code></pre>
</div>

<!-- mockup-code: With color -->
<div class="mockup-code bg-primary text-primary-content w-full">
  <pre><code>can be any color!</code></pre>
</div>

<!-- mockup-phone: iPhone mockup -->
<div class="mockup-phone">
  <div class="mockup-phone-camera"></div>
  <div class="mockup-phone-display text-white grid place-content-center bg-neutral-900">
    It's Glowtime.
  </div>
</div>

<!-- mockup-phone: With color and wallpaper -->
<div class="mockup-phone border-[#ff8938]">
  <div class="mockup-phone-camera"></div>
  <div class="mockup-phone-display">
    <img alt="wallpaper" src="https://img.daisyui.com/images/stock/453966.webp" />
  </div>
</div>

<!-- mockup-window: window mockup with border -->
<div class="mockup-window border border-base-300 w-full">
  <div class="grid place-content-center border-t border-base-300 h-80">Hello!</div>
</div>

<!-- mockup-window: window mockup with background color -->
<div class="mockup-window bg-base-100 border border-base-300">
  <div class="grid place-content-center h-80">Hello!</div>
</div>
