<!doctype html>
<html lang="en" data-theme="brand">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Library Viewer</title>
  <link rel="stylesheet" href="/.cache/preview.css">
</head>
<body class="min-h-screen bg-base-200 text-base-content">
  <header class="sticky top-0 z-20 border-b border-base-300 bg-base-100">
    <div class="flex flex-wrap items-center gap-3 px-4 py-3 lg:px-8">
      <a href="#/" class="text-lg font-semibold flex items-center gap-2">
        <span>Library</span>
        <span id="live" class="status status-success" title="live"></span>
      </a>

      <!-- Group By Tabs / Selector -->
      <div class="flex items-center gap-1 bg-base-200 p-1 rounded-lg text-xs font-medium" id="group-tabs">
        <button data-group="category" class="px-2.5 py-1 rounded bg-base-100 shadow-sm font-semibold">Category</button>
        <button data-group="language" class="px-2.5 py-1 rounded hover:bg-base-100/50">Language</button>
        <button data-group="industry" class="px-2.5 py-1 rounded hover:bg-base-100/50">Industry</button>
        <button data-group="designSystem" class="px-2.5 py-1 rounded hover:bg-base-100/50">Design System</button>
        <button data-group="type" class="px-2.5 py-1 rounded hover:bg-base-100/50">Subcategories</button>
      </div>

      <!-- Quick Filters -->
      <div class="flex flex-wrap items-center gap-2 ml-auto">
        <select id="filter-lang" class="select select-xs w-28" aria-label="Filter language"><option value="">All Languages</option></select>

        <select id="filter-industry" class="select select-xs w-28" aria-label="Filter industry"><option value="">All Industries</option></select>

        <select id="filter-ds" class="select select-xs w-32" aria-label="Filter design system"><option value="">All Systems</option></select>

        <input id="search" type="search" placeholder="Search (name, tag, ext)…" class="input input-sm w-44 lg:w-56">
        <select id="theme" class="select select-sm w-36" aria-label="Preview theme"></select>
      </div>
    </div>
  </header>
  <main id="app" class="mx-auto w-full max-w-[120rem] px-4 py-6 lg:px-8"></main>
  <script type="module" src="/viewer/app.js"></script>
</body>
</html>
