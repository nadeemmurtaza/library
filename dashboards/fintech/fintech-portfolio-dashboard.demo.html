<!doctype html>
<html lang="en" data-theme="brand">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fintech Portfolio Dashboard</title>
  <link rel="stylesheet" href="/.cache/preview.css">
  <link rel="stylesheet" href="/tokens/untitledui/tokens.css">
</head>
<body class="min-h-screen bg-base-200 text-base-content p-6">
  <div class="max-w-7xl mx-auto space-y-6">
    <div class="flex flex-wrap items-center justify-between gap-4 border-b border-base-300 pb-4">
      <div>
        <h1 class="text-2xl font-bold">Wealth & Treasury Portfolio</h1>
        <p class="text-sm opacity-70">Liquid assets, multi-currency holdings, and automated yield sweep.</p>
      </div>
      <button class="btn btn-sm btn-primary">Send Wire</button>
    </div>
    <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
      <div class="card bg-base-100 p-4 border border-base-300 shadow-sm">
        <div class="text-xs uppercase tracking-wide opacity-60 font-semibold">Total Net Liquidity</div>
        <div class="text-3xl font-bold mt-1">$1,248,500.00</div>
      </div>
      <div class="card bg-base-100 p-4 border border-base-300 shadow-sm">
        <div class="text-xs uppercase tracking-wide opacity-60 font-semibold">Annualized APY Yield</div>
        <div class="text-3xl font-bold mt-1 text-success">5.15%</div>
      </div>
      <div class="card bg-base-100 p-4 border border-base-300 shadow-sm">
        <div class="text-xs uppercase tracking-wide opacity-60 font-semibold">Pending Clearances</div>
        <div class="text-3xl font-bold mt-1">$24,190.50</div>
      </div>
    </div>
  </div>
</body>
</html>
